<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>عيادة شام لطب الأسنان | الدكتور عامر العبود</title>

  <meta name="description" content="عيادة شام لطب الأسنان - الدكتور عامر العبود. خدمات طب وتجميل الأسنان بعناية ودقة.">
  <meta name="theme-color" content="#071923">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>

    :root {
      --navy: #071923;
      --navy-2: #0d2734;
      --navy-3: #143847;

      --gold: #b89a62;
      --gold-light: #ddc797;
      --gold-dark: #8e7445;

      --cream: #f7f4ed;
      --cream-2: #eee9df;
      --white: #ffffff;

      --text: #17252d;
      --muted: #738087;

      --shadow: 0 25px 70px rgba(7,25,35,.12);
      --radius: 24px;
      --container: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: var(--white);
      color: var(--text);
      line-height: 1.8;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(100% - 40px, var(--container));
      margin: auto;
    }

    /* TOP BAR */

    .topbar {
      background: var(--navy);
      color: rgba(255,255,255,.72);
      font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .topbar-inner {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .topbar-right,
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .topbar a {
      transition: .3s;
    }

    .topbar a:hover {
      color: var(--gold-light);
    }

    /* NAVIGATION */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(7,25,35,.08);
    }

    .nav-inner {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      color: var(--gold-dark);
      font-family: "Playfair Display", serif;
      font-size: 22px;
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(184,154,98,.35);
      border-radius: 50%;
    }

    .brand-text strong {
      display: block;
      font-size: 18px;
      color: var(--navy);
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-text span {
      display: block;
      color: var(--gold-dark);
      font-size: 10px;
      letter-spacing: 1px;
      margin-top: 3px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 13px;
      color: #4b5a61;
    }

    .nav-links a {
      position: relative;
      transition: .3s;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      bottom: -9px;
      right: 0;
      width: 0;
      height: 2px;
      background: var(--gold);
      transition: .3s;
    }

    .nav-links a:hover {
      color: var(--navy);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-call {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--navy);
      color: white;
      padding: 11px 17px;
      border-radius: 100px;
      font-size: 12px;
      transition: .3s;
      white-space: nowrap;
    }

    .nav-call:hover {
      background: var(--gold-dark);
      transform: translateY(-2px);
    }

    /* HERO */

    .hero {
      position: relative;
      background:
        radial-gradient(circle at 10% 20%, rgba(184,154,98,.13), transparent 30%),
        linear-gradient(135deg,#f8f5ef 0%,#fff 55%,#edf2f1 100%);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border: 1px solid rgba(184,154,98,.18);
      border-radius: 50%;
      left: -220px;
      top: -180px;
    }

    .hero-inner {
      min-height: 700px;
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      align-items: center;
      gap: 65px;
      padding: 70px 0;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--gold-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .eyebrow::before {
      content: "";
      width: 35px;
      height: 1px;
      background: var(--gold);
    }

    .hero h1 {
      color: var(--navy);
      font-size: clamp(42px,5vw,72px);
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .hero h1 span {
      display: block;
      color: var(--gold-dark);
      font-family: "Playfair Display",serif;
      font-weight: 600;
    }

    .hero-description {
      max-width: 570px;
      color: #637078;
      font-size: 16px;
      line-height: 2;
      margin-bottom: 32px;
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 51px;
      padding: 0 24px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      transition: .35s;
    }

    .btn-primary {
      background: var(--navy);
      color: white;
      box-shadow: 0 12px 30px rgba(7,25,35,.16);
    }

    .btn-primary:hover {
      background: var(--gold-dark);
      transform: translateY(-3px);
    }

    .btn-outline {
      border: 1px solid rgba(7,25,35,.18);
      color: var(--navy);
      background: rgba(255,255,255,.6);
    }

    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--gold-dark);
      transform: translateY(-3px);
    }

    /* HERO IMAGE */

    .hero-visual {
      position: relative;
      min-height: 550px;
    }

    .hero-photo-frame {
      position: absolute;
      inset: 15px 0 0 30px;
      border-radius: 35px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--cream-2);
    }

    .hero-photo-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 52%,
        rgba(7,25,35,.42)
      );
      pointer-events: none;
    }

    .hero-photo-frame img {
      width: 100%;
      height: 100%;
      min-height: 550px;
      object-fit: cover;
    }

    .gold-frame {
      position: absolute;
      inset: 0 30px 30px 0;
      border: 1px solid var(--gold);
      border-radius: 35px;
      opacity: .6;
      pointer-events: none;
    }

    .hero-badge {
      position: absolute;
      right: -18px;
      bottom: 50px;
      z-index: 3;
      background: var(--navy);
      color: white;
      padding: 18px 24px;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(7,25,35,.2);
    }

    .hero-badge small {
      display: block;
      color: var(--gold-light);
      font-size: 10px;
      margin-bottom: 2px;
    }

    .hero-badge strong {
      display: block;
      font-size: 16px;
    }

    /* TRUST */

    .trust-strip {
      background: var(--navy);
      color: white;
    }

    .trust-inner {
      min-height: 115px;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      align-items: center;
    }

    .trust-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 20px;
      border-left: 1px solid rgba(255,255,255,.1);
    }

    .trust-item:last-child {
      border-left: 0;
    }

    .trust-icon {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(216,192,143,.55);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--gold-light);
      font-size: 17px;
    }

    .trust-item strong {
      display: block;
      font-size: 13px;
    }

    .trust-item span {
      display: block;
      color: rgba(255,255,255,.52);
      font-size: 10px;
    }

    /* GENERAL */

    .section {
      padding: 105px 0;
    }

    .section-soft {
      background: var(--cream);
    }

    .section-heading {
      max-width: 720px;
      margin: 0 auto 52px;
      text-align: center;
    }

    .section-heading .mini {
      color: var(--gold-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .section-heading h2 {
      color: var(--navy);
      font-size: clamp(30px,4vw,45px);
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 14px;
    }

    /* SERVICES */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 18px;
    }

    .service-card {
      position: relative;
      background: white;
      padding: 31px 26px;
      border: 1px solid rgba(7,25,35,.07);
      border-radius: var(--radius);
      transition: .35s;
      overflow: hidden;
    }

    .service-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 3px;
      background: var(--gold);
      transition: .35s;
    }

    .service-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 20px 50px rgba(7,25,35,.1);
    }

    .service-card:hover::before {
      width: 100%;
    }

    .service-number {
      color: rgba(184,154,98,.5);
      font-family: "Playfair Display",serif;
      font-size: 27px;
      margin-bottom: 14px;
    }

    .service-card h3 {
      color: var(--navy);
      font-size: 19px;
      margin-bottom: 8px;
    }

    .service-card p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.9;
    }

    /* ABOUT */

    .about-grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 75px;
      align-items: center;
    }

    .about-visual {
      position: relative;
      min-height: 500px;
    }

    .about-box {
      position: absolute;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .about-box.main {
      inset: 0 0 50px 70px;
      background: var(--navy);
    }

    .about-box.main::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 50%,
        rgba(7,25,35,.45)
      );
    }

    .about-box.main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .about-box.small {
      width: 210px;
      height: 180px;
      left: 0;
      bottom: 0;
      background: var(--gold);
      border: 8px solid var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .about-box.small strong {
      display: block;
      font-family: "Playfair Display",serif;
      font-size: 34px;
    }

    .about-box.small span {
      font-size: 11px;
    }

    .about-content .eyebrow {
      margin-bottom: 15px;
    }

    .about-content h2 {
      color: var(--navy);
      font-size: clamp(31px,4vw,46px);
      line-height: 1.35;
      margin-bottom: 21px;
    }

    .about-content > p {
      color: var(--muted);
      font-size: 14px;
      line-height: 2.1;
      margin-bottom: 27px;
    }

    .about-list {
      display: grid;
      gap: 12px;
      margin-bottom: 29px;
    }

    .about-list div {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #45545c;
      font-size: 13px;
    }

    .about-list span {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(184,154,98,.13);
      color: var(--gold-dark);
      font-size: 11px;
      flex-shrink: 0;
    }

    /* DOCTOR */

    .doctor-section {
      background: linear-gradient(135deg,var(--navy),var(--navy-2));
      color: white;
      position: relative;
      overflow: hidden;
    }

    .doctor-section::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border: 1px solid rgba(216,192,143,.15);
      border-radius: 50%;
      left: -250px;
      bottom: -280px;
    }

    .doctor-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 80px;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .doctor-photo {
      position: relative;
      max-width: 430px;
      margin: auto;
    }

    .doctor-photo::before {
      content: "";
      position: absolute;
      inset: 18px -18px -18px 18px;
      border: 1px solid var(--gold);
      border-radius: 30px;
    }

    .doctor-photo-inner {
      position: relative;
      z-index: 2;
      overflow: hidden;
      border-radius: 30px;
      background: var(--cream-2);
      aspect-ratio: 4 / 5;
      box-shadow: 0 25px 60px rgba(0,0,0,.3);
    }

    .doctor-photo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .doctor-content .eyebrow {
      color: var(--gold-light);
    }

    .doctor-content h2 {
      font-size: clamp(34px,4vw,53px);
      line-height: 1.25;
      margin-bottom: 5px;
    }

    .doctor-name {
      color: var(--gold-light);
      font-family: "Playfair Display",serif;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .doctor-content p {
      color: rgba(255,255,255,.69);
      font-size: 14px;
      line-height: 2.1;
      max-width: 620px;
      margin-bottom: 27px;
    }

    .doctor-details {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .doctor-detail {
      padding: 17px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 15px;
      background: rgba(255,255,255,.035);
    }

    .doctor-detail span {
      display: block;
      color: rgba(255,255,255,.42);
      font-size: 10px;
      margin-bottom: 3px;
    }

    .doctor-detail strong {
      color: white;
      font-size: 12px;
    }

    /* CASE */

    .case-card {
      background: white;
      border-radius: 30px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      box-shadow: var(--shadow);
      border: 1px solid rgba(7,25,35,.06);
    }

    .case-image {
      min-height: 520px;
      background: var(--cream-2);
      position: relative;
    }

    .case-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .case-label {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(7,25,35,.88);
      color: white;
      padding: 8px 14px;
      border-radius: 100px;
      font-size: 10px;
      backdrop-filter: blur(8px);
    }

    .case-content {
      padding: 54px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .case-content .mini {
      color: var(--gold-dark);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 11px;
    }

    .case-content h2 {
      color: var(--navy);
      font-size: 33px;
      line-height: 1.45;
      margin-bottom: 17px;
    }

    .case-content p {
      color: var(--muted);
      font-size: 13px;
      line-height: 2;
      margin-bottom: 27px;
    }

    .case-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid #e7e4dd;
      border-bottom: 1px solid #e7e4dd;
      margin-bottom: 27px;
    }

    .case-meta div {
      padding: 15px 10px;
      border-left: 1px solid #e7e4dd;
    }

    .case-meta div:nth-child(even) {
      border-left: 0;
    }

    .case-meta span {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .case-meta strong {
      display: block;
      color: var(--navy);
      font-size: 13px;
    }

    /* CONTACT */

    .contact-section {
      background: var(--cream);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 50px;
      align-items: stretch;
    }

    .contact-info {
      background: var(--navy);
      color: white;
      border-radius: 28px;
      padding: 44px;
      position: relative;
      overflow: hidden;
    }

    .contact-info::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(216,192,143,.14);
      border-radius: 50%;
      left: -120px;
      bottom: -130px;
    }

    .contact-info .eyebrow {
      color: var(--gold-light);
    }

    .contact-info h2 {
      font-size: 34px;
      line-height: 1.4;
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .contact-info > p {
      color: rgba(255,255,255,.58);
      font-size: 13px;
      line-height: 2;
      margin-bottom: 28px;
      position: relative;
      z-index: 2;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 17px;
      position: relative;
      z-index: 2;
    }

    .contact-icon {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(216,192,143,.35);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--gold-light);
      flex-shrink: 0;
    }

    .contact-item span {
      display: block;
      color: rgba(255,255,255,.4);
      font-size: 9px;
    }

    .contact-item strong {
      display: block;
      color: white;
      font-size: 13px;
    }

    .contact-buttons {
      display: flex;
      gap: 10px;
      margin-top: 28px;
      position: relative;
      z-index: 3;
    }

    .contact-buttons .btn {
      flex: 1;
      padding: 0 13px;
    }

    .contact-buttons .btn-primary {
      background: var(--gold);
      color: var(--navy);
    }

    .contact-buttons .btn-primary:hover {
      background: var(--gold-light);
    }

    .contact-form {
      background: white;
      border-radius: 28px;
      padding: 44px;
      box-shadow: 0 15px 50px rgba(7,25,35,.07);
    }

    .contact-form h3 {
      color: var(--navy);
      font-size: 27px;
      margin-bottom: 7px;
    }

    .contact-form > p {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;
      color: #526067;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid #e0e3e2;
      border-radius: 13px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 12px;
      color: var(--text);
      outline: none;
      background: #fbfcfb;
      transition: .25s;
    }

    .field textarea {
      min-height: 115px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea
        <section class="section" id="case">

      <div class="container">

        <div class="section-heading">

          <div class="mini">
            من أعمال العيادة
          </div>

          <h2>
            حالة علاجية
          </h2>

          <p>
            مثال على إحدى الحالات التي تم العمل عليها في

          </p>

        </div>


        <div class="case-card">

          <div class="case-image">

            <img

              alt="حالة علاجية من عيادة شام لطب الأسنان"
            >
