  <style>

    :root {
      --navy: #0b1d2a;
      --navy-light: #122d3d;

      --ivory: #f7f4ee;
      --white: #fffdf9;

      --gold: #b99a62;
      --gold-light: #d7c092;

      --text: #17232c;
      --muted: #707a80;

      --border: rgba(185,154,98,.25);

      --shadow: 0 25px 70px rgba(11,29,42,.12);

      --radius: 22px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: var(--white);
      color: var(--text);
      line-height: 1.9;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(1180px, calc(100% - 40px));
      margin: auto;
    }

    /* =========================
       TOP BAR
    ========================== */

    .topbar {
      background: var(--navy);
      color: rgba(255,255,255,.8);
      font-size: 13px;
      padding: 8px 0;
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    /* =========================
       NAVIGATION
    ========================== */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(255,253,249,.96);
      backdrop-filter: blur(14px);

      border-bottom: 1px solid rgba(11,29,42,.08);
    }

    .nav-inner {
      min-height: 82px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo-mark {
      width: 45px;
      height: 45px;

      border: 1px solid var(--gold);
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--gold);
      font-family: "Playfair Display", serif;
      font-size: 22px;
    }

    .logo-text strong {
      display: block;
      color: var(--navy);
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .logo-text span {
      display: block;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      transition: .25s ease;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .nav-button {
      padding: 10px 19px;

      background: var(--navy);
      color: white !important;

      border-radius: 4px;

      transition: .25s ease;
    }

    .nav-button:hover {
      background: var(--gold);
    }

       HERO
