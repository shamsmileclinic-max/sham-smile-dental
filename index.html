<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>عيادة شام لطب الأسنان | الدكتور عامر العبود</title>

  <meta name="description"
        content="عيادة شام لطب الأسنان — الدكتور عامر العبود. تجميل الأسنان، تصميم الابتسامة، القشور السنية وعلاج اللثة.">

  <meta name="theme-color" content="#0b1d2a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

  <style>

    /* =====================================================
       VARIABLES
    ===================================================== */

    :root {
      --navy: #0b1d2a;
      --navy-light: #122d3d;

      --ivory: #f7f4ee;
      --white: #fffdf9;

      --gold: #b99a62;
      --gold-light: #d7c092;

      --text: #17232c;
      --muted: #707a80;

      --line: rgba(11, 29, 42, 0.12);

      --shadow:
        0 25px 70px rgba(11, 29, 42, 0.10);

      --radius: 2px;
    }


    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--ivory);
      color: var(--text);
      font-family: "Cairo", sans-serif;
      line-height: 1.8;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button {
      font-family: inherit;
    }


    /* =====================================================
       GENERAL
    ===================================================== */

    .container {
      width: min(1180px, calc(100% - 48px));
      margin: auto;
    }

    .gold-line {
      width: 55px;
      height: 1px;
      background: var(--gold);
      display: block;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 3px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: clamp(34px, 5vw, 62px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    .section-title span {
      color: var(--gold);
    }

    .section-text {
      color: var(--muted);
      font-size: 16px;
      line-height: 2;
      max-width: 620px;
    }


    /* =====================================================
       TOP BAR
    ===================================================== */

    .topbar {
      background: var(--navy);
      color: #fff;
      padding: 9px 0;
      font-size: 12px;
      letter-spacing: .5px;
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .topbar span {
      opacity: .82;
    }

    .topbar strong {
      color: var(--gold-light);
      font-weight: 600;
    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    .nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(247, 244, 238, .94);
      backdrop-filter: blur(16px);

      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      height: 86px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;

      border: 1px solid var(--gold);

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--gold);
      font-family: "Playfair Display", serif;
      font-size: 20px;
    }

    .brand-text {
      line-height: 1.1;
    }

    .brand-text strong {
      display: block;
      font-size: 17px;
      font-weight: 800;
      color: var(--navy);
    }

    .brand-text small {
      color: var(--gold);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 27px;
      font-size: 13px;
      font-weight: 600;
    }

    .nav-links a {
      position: relative;
      transition: .3s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -8px;

      width: 0;
      height: 1px;

      background: var(--gold);

      transition: .3s ease;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-button {
      border: 1px solid var(--navy);
      padding: 11px 20px;
      font-size: 12px;
      transition: .3s ease;
    }

    .nav-button:hover {
      background: var(--navy);
      color: white;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      min-height: calc(100vh - 130px);

      display: flex;
      align-items: center;

      padding: 80px 0;
      position: relative;

      overflow: hidden;
    }

    .hero::before {
      content: "";

      position: absolute;
      width: 500px;
      height: 500px;

      left: -220px;
      top: 50px;

      border: 1px solid rgba(185, 154, 98, .18);
      border-radius: 50%;
    }

    .hero::after {
      content: "";

      position: absolute;
      width: 300px;
      height: 300px;

      left: -120px;
      top: 150px;

      border: 1px solid rgba(185, 154, 98, .12);
      border-radius: 50%;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 80px;

      align-items: center;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-content h1 {
      font-size: clamp(46px, 6vw, 82px);
      line-height: 1.05;

      letter-spacing: -3px;

      margin-bottom: 25px;

      color: var(--navy);
    }

    .hero-content h1 span {
      display: block;
      color: var(--gold);
    }

    .hero-description {
      max-width: 570px;

      color: var(--muted);

      font-size: 17px;
      line-height: 2;

      margin-bottom: 35px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 27px;

      font-size: 13px;
      font-weight: 700;

      border: 1px solid var(--navy);

      transition: .35s ease;
    }

    .btn-primary {
      background: var(--navy);
      color: white;
    }

    .btn-primary:hover {
      background: var(--gold);
      border-color: var(--gold);
    }

    .btn-secondary {
      color: var(--navy);
    }

    .btn-secondary:hover {
      background: white;
    }

    .hero-image-wrap {
      position: relative;
    }

    .hero-image {
      height: 610px;
      position: relative;

      overflow: hidden;

      background:
        linear-gradient(135deg, #eae4d9, #fdfbf6);
    }

    .hero-image::before {
      content: "SHAM SMILE";

      position: absolute;

      left: -10px;
      bottom: 35px;

      writing-mode: vertical-rl;

      color: rgba(255,255,255,.8);

      font-size: 12px;
      letter-spacing: 5px;

      z-index: 2;
    }

    .hero-image::after {
      content: "";

      position: absolute;

      inset: 18px;

      border: 1px solid rgba(255,255,255,.65);

      pointer-events: none;
    }

    .hero-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      filter: saturate(.85);
    }

    .hero-badge {
      position: absolute;

      bottom: -25px;
      right: -25px;

      width: 150px;
      height: 150px;

      background: var(--navy);
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      border: 1px solid var(--gold);
    }

    .hero-badge strong {
      font-family: "Playfair Display", serif;
      font-size: 31px;
      color: var(--gold-light);
    }

    .hero-badge span {
      font-size: 10px;
      letter-spacing: 1px;
    }


    /* =====================================================
       VALUES
    ===================================================== */

    .values {
      background: white;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .values-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .value {
      padding: 35px 30px;
      border-left: 1px solid var(--line);
    }

    .value:last-child {
      border-left: 0;
    }

    .value-number {
      color: var(--gold);
      font-family: "Playfair Display", serif;
      font-size: 25px;
      margin-bottom: 7px;
    }

    .value h3 {
      font-size: 17px;
      margin-bottom: 5px;
    }

    .value p {
      color: var(--muted);
      font-size: 13px;
    }


    /* =====================================================
       SERVICES
    ===================================================== */

    .services {
      padding: 125px 0;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 40px;

      margin-bottom: 65px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .service {
      min-height: 245px;

      padding: 35px;

      border-left: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      position: relative;

      transition: .35s ease;
    }

    .service:hover {
      background: var(--navy);
      color: white;
    }

    .service-number {
      font-family: "Playfair Display", serif;
      color: var(--gold);

      font-size: 16px;

      margin-bottom: 55px;
    }

    .service h3 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .service p {
      color: var(--muted);
      font-size: 13px;
      max-width: 280px;
    }

    .service:hover p {
      color: rgba(255,255,255,.7);
    }

    .service-arrow {
      position: absolute;

      left: 28px;
      bottom: 28px;

      color: var(--gold);

      font-size: 22px;
    }


    /* =====================================================
       ABOUT
    ===================================================== */

    .about {
      background: var(--navy);
      color: white;

      padding: 125px 0;

      position: relative;
      overflow: hidden;
    }

    .about::before {
      content: "SMILE";

      position: absolute;

      left: -80px;
      bottom: -80px;

      font-family: "Playfair Display", serif;

      font-size: 210px;

      color: rgba(255,255,255,.025);
    }

    .about-grid {
      display: grid;

      grid-template-columns: .8fr 1.2fr;

      gap: 100px;

      align-items: center;
    }

    .about-label {
      color: var(--gold-light);
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    .about-title {
      font-size: clamp(38px, 5vw, 65px);
      line-height: 1.15;
      margin-bottom: 30px;
    }

    .about-title span {
      color: var(--gold-light);
    }

    .about-text {
      color: rgba(255,255,255,.7);
      font-size: 15px;
      line-height: 2.2;
      max-width: 700px;
    }

    .about-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      margin-top: 45px;

      border-top: 1px solid rgba(255,255,255,.12);
    }

    .about-detail {
      padding: 22px 0;

      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .about-detail strong {
      display: block;
      color: var(--gold-light);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .about-detail span {
      font-size: 14px;
      color: rgba(255,255,255,.75);
    }

    .about-card {
      min-height: 520px;

      border: 1px solid rgba(185,154,98,.35);

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    .about-card-inner {
      width: 75%;
      height: 75%;

      border: 1px solid rgba(255,255,255,.12);

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 50px;
    }

    .about-card-inner .initial {
      font-family: "Playfair Display", serif;

      font-size: 100px;

      color: var(--gold);

      line-height: 1;

      margin-bottom: 20px;
    }

    .about-card-inner h3 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .about-card-inner p {
      color: rgba(255,255,255,.55);
      font-size: 13px;
    }


    /* =====================================================
       CASE STUDY
    ===================================================== */

    .cases {
      padding: 125px 0;
    }

    .case-grid {
      display: grid;

      grid-template-columns: 1.3fr .7fr;

      gap: 70px;

      align-items: center;
    }

    .case-image {
      background: #e8e1d5;

      padding: 12px;

      position: relative;
    }

    .case-image::before {
      content: "CASE 01";

      position: absolute;

      top: -16px;
      right: 25px;

      background: var(--navy);
      color: var(--gold-light);

      padding: 9px 18px;

      font-family: "Playfair Display", serif;
      font-size: 13px;

      z-index: 3;
    }

    .case-image img {
      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;

      background: white;
    }

    .case-content {
      padding-right: 15px;
    }

    .case-content h2 {
      font-size: clamp(35px, 4vw, 55px);

      line-height: 1.2;

      margin-bottom: 25px;
    }

    .case-content > p {
      color: var(--muted);

      font-size: 15px;

      line-height: 2.1;

      margin-bottom: 35px;
    }

    .case-meta {
      border-top: 1px solid var(--line);
    }

    .case-meta-row {
      display: flex;
      justify-content: space-between;

      padding: 17px 0;

      border-bottom: 1px solid var(--line);

      font-size: 13px;
    }

    .case-meta-row span:first-child {
      color: var(--muted);
    }

    .case-meta-row span:last-child {
      font-weight: 700;
    }


    /* =====================================================
       DOCTOR
    ===================================================== */

    .doctor {
      background: white;
      padding: 125px 0;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .doctor-grid {
      display: grid;

      grid-template-columns: .7fr 1.3fr;

      gap: 100px;

      align-items: center;
    }

    .doctor-frame {
      height: 480px;

      background:
        linear-gradient(145deg, var(--navy), #17384b);

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    .doctor-frame::before {
      content: "";

      position: absolute;

      width: 70%;
      height: 70%;

      border: 1px solid rgba(185,154,98,.5);
    }

    .doctor-initial {
      position: relative;

      font-family: "Playfair Display", serif;

      font-size: 120px;

      color: var(--gold-light);
    }

    .doctor-content .eyebrow {
      margin-bottom: 15px;
    }

    .doctor-content h2 {
      font-size: clamp(38px, 5vw, 62px);

      margin-bottom: 12px;
    }

    .doctor-role {
      color: var(--gold);

      font-size: 14px;

      margin-bottom: 30px;
    }

    .doctor-content p {
      max-width: 650px;

      color: var(--muted);

      font-size: 15px;

      line-height: 2.2;
    }


    /* =====================================================
       CONTACT
    ===================================================== */

    .contact {
      padding: 125px 0;
    }

    .contact-box {
      background: var(--navy);

      color: white;

      padding: 70px;

      display: grid;

      grid-template-columns: 1fr .7fr;

      gap: 80px;

      position: relative;

      overflow: hidden;
    }

    .contact-box::after {
      content: "";

      position: absolute;

      width: 350px;
      height: 350px;

      border-radius: 50%;

      border: 1px solid rgba(185,154,98,.2);

      left: -120px;
      bottom: -160px;
    }

    .contact-title {
      font-size: clamp(38px, 5vw, 65px);

      line-height: 1.15;

      margin-bottom: 20px;
    }

    .contact-title span {
      color: var(--gold-light);
    }

    .contact-text {
      color: rgba(255,255,255,.65);

      font-size: 15px;

      max-width: 600px;

      line-height: 2;
    }

    .contact-side {
      display: flex;
      flex-direction: column;
      justify-content: center;

      border-right: 1px solid rgba(255,255,255,.12);

      padding-right: 50px;
    }

    .contact-side-label {
      color: var(--gold-light);

      font-size: 12px;

      letter-spacing: 2px;

      margin-bottom: 12px;
    }

    .contact-side p {
      color: rgba(255,255,255,.75);

      font-size: 14px;

      margin-bottom: 30px;
    }

    .contact-note {
      color: rgba(255,255,255,.45);

      font-size: 12px;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    footer {
      background: #06141e;

      color: white;

      padding: 45px 0 25px;
    }

    .footer-top {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 30px;

      padding-bottom: 35px;

      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .footer-brand strong {
      display: block;

      font-size: 19px;

      margin-bottom: 5px;
    }

    .footer-brand span {
      color: var(--gold-light);

      font-size: 10px;

      letter-spacing: 3px;
    }

    .footer-links {
      display: flex;

      gap: 25px;

      color: rgba(255,255,255,.6);

      font-size: 12px;
    }

    .footer-bottom {
      padding-top: 22px;

      display: flex;

      justify-content: space-between;

      color: rgba(255,255,255,.35);

      font-size: 11px;
    }


    /* =====================================================
       ANIMATIONS
    ===================================================== */

    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .hero-content {
      animation: fadeUp .8s ease both;
    }

    .hero-image-wrap {
      animation: fadeUp 1s .15s ease both;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 950px) {

      .nav-links {
        display: none;
      }

      .hero-grid,
      .about-grid,
      .case-grid,
      .doctor-grid,
      .contact-box {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 60px 0 100px;
      }

      .hero-image {
        height: 500px;
      }

      .hero-badge {
        right: 15px;
      }

      .section-heading {
        align-items: start;
        flex-direction: column;
      }

      .services-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .about-grid,
      .doctor-grid {
        gap: 55px;
      }

      .contact-side {
        border-right: 0;
        border-top: 1px solid rgba(255,255,255,.12);
        padding-right: 0;
        padding-top: 35px;
      }

    }


    @media (max-width: 650px) {

      .container {
        width: min(100% - 30px, 1180px);
      }

      .topbar {
        display: none;
      }

      .nav-inner {
